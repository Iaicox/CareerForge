<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerForge postings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16181d;
    --muted: #6b7280;
    --line: #e2e5ea;
    --accent: #3b6ef5;
    --danger: #c0392b;
    --ok: #1e7f4f;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --ink: #e8eaed;
      --muted: #9aa1ac;
      --line: #2b2f37;
      --accent: #6d93ff;
      --danger: #ff6b5b;
      --ok: #4cc38a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header .meta { color: var(--muted); font-size: 12px; }
  header a.nav { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a.nav:hover { color: var(--accent); }
  header button {
    margin-left: auto; font: inherit; padding: 5px 11px; cursor: pointer;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px;
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }

  #filters {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
  }
  #filters label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  input, select, button { font: inherit; color: inherit; }
  input, select {
    padding: 5px 8px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
  }
  #filters input[type=search] { min-width: 220px; }
  #filters input[type=number] { width: 70px; }

  /* No overflow here. When one axis is not `visible` CSS computes the other
     to `auto`, which makes .wrap a scroll container on both axes -- and a
     sticky th then resolves its `top` against .wrap instead of the viewport.
     .wrap never scrolls vertically, so the header parked itself below the
     table's top edge and covered the first rows. There is no ancestor between
     th and the viewport that can carry overflow, so a wide table scrolls the
     page sideways instead. */
  .wrap { padding: 12px 18px 40px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel);
          border: 1px solid var(--line); border-radius: var(--radius); }
  th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  /* --head-h is measured from the real header on load and on resize, because
     the header wraps at narrow widths and a hardcoded offset is wrong there.
     It is floored, so it never exceeds the real height and the row can only
     ever tuck under the header, never sit below it -- the header is opaque
     and a layer above (z-index 5 to this 4), so an overlap is invisible where
     a shortfall is not. */
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
       font-weight: 650; white-space: nowrap; position: sticky; top: var(--head-h, 49px);
       background: var(--panel); z-index: 4;
       /* border-collapse drops the cell's own border while it is stuck. */
       box-shadow: inset 0 -1px 0 var(--line); user-select: none; }
  /* The trailing th is a spacer with no data-key and nothing to sort by, so
     only the real column headers offer the cursor that promises a sort. */
  th[data-key] { cursor: pointer; }
  th[data-key]:hover { color: var(--ink); }
  th .arrow { opacity: .55; font-size: 9px; margin-left: 3px; }
  th[aria-sort] { color: var(--ink); }
  /* No nowrap, unlike the other numeric columns. A stated figure is a verbatim
     sentence -- "45.000-60.000 EUR/year, 14 payments" -- and holding that on
     one line pushes the table past the viewport. The page is the horizontal
     scroll container (see .wrap above), and the sticky header does not follow
     it sideways, so a wide table uncovers the rows it is meant to hide.
     Wrapping is the whole of the limit: max-width on a cell is a hint the
     auto table layout is free to ignore, so there is no point stating one. */
  td.salary { text-align: right; font-variant-numeric: tabular-nums; }
  td.salary .est { color: var(--muted); font-style: italic; }
  tbody tr:hover { background: var(--bg); }
  tbody tr.terminal td { color: var(--muted); }
  td.co { font-weight: 620; white-space: nowrap; }
  td.title { min-width: 220px; }
  td.title a { color: var(--accent); text-decoration: none; }
  td.title a:hover { text-decoration: underline; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.status select { padding: 3px 6px; }
  td.note { min-width: 260px; max-width: 460px; color: var(--muted); cursor: text; }
  td.note:hover { color: var(--ink); }
  td.note.editing { padding: 3px 6px; }
  td.note textarea { width: 100%; min-height: 60px; padding: 5px 7px; background: var(--bg);
                     border: 1px solid var(--accent); border-radius: 6px; resize: vertical; }
  td.app { white-space: nowrap; font-size: 12px; color: var(--muted); }
  .badge {
    font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .badge.strong, .badge.good { color: var(--ok); }
  .badge.weak, .badge.poor { color: var(--danger); }
  .badge.warn { color: var(--danger); }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    max-width: 620px; padding: 10px 14px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--danger); color: var(--danger);
    box-shadow: 0 6px 22px rgba(0,0,0,.18); z-index: 20; display: none;
  }
  #toast.ok { border-color: var(--ok); color: var(--ok); }
  .empty { color: var(--muted); padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>CareerForge</h1>
  <a class="nav" href="/">Applications</a>
  <span class="meta">Postings</span>
  <span class="meta" id="meta"></span>
  <button id="refresh">Refresh</button>
</header>

<div id="filters">
  <label>Status <select id="fStatus"></select></label>
  <label>Min score <input id="fScore" type="number" min="0" max="100" step="5"></label>
  <label><input id="fSearch" type="search" placeholder="company or title"></label>
</div>

<div class="wrap"><div id="table"><p class="empty">Loading&hellip;</p></div></div>

<div id="toast"></div>

<script>
"use strict";

const tableEl = document.getElementById("table");
const metaEl  = document.getElementById("meta");
const toastEl = document.getElementById("toast");
const fStatus = document.getElementById("fStatus");
const fScore  = document.getElementById("fScore");
const fSearch = document.getElementById("fSearch");

let state = null;
let toastTimer = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// esc() escapes the quotes, not the scheme, and the browser decodes entities
// when it parses the attribute -- so a `javascript:` URL still runs on click.
// These pages serve unauthenticated POST endpoints on their own origin, and
// the URLs come from scraped boards and pasted text. Anything that is not
// http(s) is rendered as text.
function safeHref(url) {
  return /^https?:\/\//i.test(String(url || "")) ? url : null;
}

// Status and verdict are ranked, not alphabetical, and only the server knows
// the ranking. The statuses are the user's own, in the user's language, and
// several locales prefix them with an emoji -- sorting the rendered label
// would order the funnel by codepoint, putting "skipped" above "new" and
// calling it ascending. Rebuilt whenever the payload changes, because a
// status the user adds to config.toml arrives in the payload, not here.
let statusRank = new Map();
let verdictRank = new Map();
let collateLocale;

// Intl throws RangeError on a tag it cannot parse, and `locale` is free text
// out of config.toml. Unhandled it would come out of applySort, through
// render, and leave the table dead on load with a sort remembered. Tested
// once per payload; a tag that is not one simply sorts in the browser's.
function safeLocale(tag) {
  if (!tag) return undefined;
  try { "a".localeCompare("b", tag); return tag; } catch (e) { return undefined; }
}

function setState(next) {
  state = next;
  statusRank = new Map((state.statuses || []).map((s, i) => [s.id, i]));
  verdictRank = new Map((state.verdict_order || []).map((v, i) => [v, i]));
  collateLocale = safeLocale(state.locale);
}

const rankOf = (map, value) => (map.has(value) ? map.get(value) : null);

// Which column orders the table. `key: null` is the server's own order --
// score first, then verdict, then company -- and cycling a header returns to
// it, so the ranking view is never lost behind a sort.
const SORT_KEYS = {
  company:    (r) => r.company,
  title:      (r) => r.title || r.url,
  salary:     (r) => r.salary?.sort ?? null,
  status:     (r) => rankOf(statusRank, r.status),
  score:      (r) => r.score,
  verdict:    (r) => rankOf(verdictRank, r.verdict),
  deadline:   (r) => r.deadline,
  source:     (r) => r.source,
  first_seen: (r) => r.first_seen,
  note:       (r) => r.note,
};
let sort = { key: null, dir: 1 };

function rememberedSort() {
  try {
    const raw = JSON.parse(localStorage.getItem("postings.sort") || "null");
    // `dir` is checked as well as `key`: anything else multiplies the
    // comparator's result by NaN, and a comparator returning NaN leaves the
    // order undefined rather than merely wrong.
    if (raw && (raw.key === null || SORT_KEYS[raw.key])
            && (raw.dir === 1 || raw.dir === -1)) return raw;
  } catch (e) { /* private mode, or a stale shape */ }
  return { key: null, dir: 1 };
}

function toggleSort(key) {
  if (sort.key !== key) sort = { key, dir: 1 };
  else if (sort.dir === 1) sort = { key, dir: -1 };
  else sort = { key: null, dir: 1 };   // back to the server's order
  try { localStorage.setItem("postings.sort", JSON.stringify(sort)); } catch (e) { /* ignore */ }
  render();
}

// Sorts the row objects, never the rendered text: the cells show DD.MM.YYYY,
// and ordering those as strings would put every 01.xx first.
function applySort(rows) {
  const get = SORT_KEYS[sort.key];
  if (!get) return rows;
  const empty = (v) => v === null || v === undefined || v === "";
  return rows.slice().sort((a, b) => {
    const x = get(a), y = get(b);
    // Nothing known sinks to the bottom in both directions. A blank is not
    // "smallest"; it is absent, and it is never what you sorted to find.
    if (empty(x) && empty(y)) return 0;
    if (empty(x)) return 1;
    if (empty(y)) return -1;
    const cmp = (typeof x === "number" && typeof y === "number")
      ? x - y
      : String(x).localeCompare(String(y), collateLocale,
                                { numeric: true, sensitivity: "base" });
    return cmp * sort.dir;
  });
}

// The table reads DD.MM.YYYY; the database stores ISO. Anything that is not a
// plain ISO date passes through untouched -- deadline is nullable, and
// created_at carries a time.
function fmtDate(value) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value ?? "").trim());
  return m ? `${m[3]}.${m[2]}.${m[1]}` : String(value ?? "");
}

// Which of the two figures this is has to be readable at a glance: the default
// reading of a number in a job table is "this is what they said", so the
// benchmark is marked and the posting's own words are not.
function salaryCell(cell) {
  if (!cell) return `<td class="salary"></td>`;
  const body = cell.kind === "benchmark"
    ? `<span class="est">&asymp;&nbsp;${esc(cell.text)}</span>`
    : esc(cell.text);
  return `<td class="salary" title="${esc(cell.detail || "")}">${body}</td>`;
}

// The header is sticky at top:0 and the th sticks under it. Measured rather
// than hardcoded because the header wraps at narrow widths.
//
// Floor, never round. The height is fractional on a scaled display -- 60.7px
// with a 0.8px border at dpr 2.5 -- and rounding that up to 61 put the row
// 0.3px below the header, a slot the table flickered through on every scroll.
function syncStickyOffset() {
  const h = document.querySelector("header").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--head-h", `${Math.floor(h)}px`);
}

function toast(message, ok = false) {
  toastEl.textContent = message;
  toastEl.classList.toggle("ok", ok);
  toastEl.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, ok ? 3200 : 8000);
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  } : undefined);
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data.error || "request failed");
  return data;
}

// The status filter remembers itself per browser; everything else is per load.
function rememberedFilter() {
  try { return localStorage.getItem("postings.status") || "open"; } catch (e) { return "open"; }
}
function rememberFilter(value) {
  try { localStorage.setItem("postings.status", value); } catch (e) { /* private mode */ }
}

async function load() {
  try {
    setState(await api("/api/postings"));
    if (!fStatus.options.length) {
      fStatus.innerHTML = [
        `<option value="open">open (not applied, skipped or expired)</option>`,
        `<option value="all">everything</option>`,
      ].concat(state.statuses.map((s) => `<option value="${esc(s.id)}">${esc(s.label)}</option>`)).join("");
      fStatus.value = rememberedFilter();
      if (!fStatus.value) fStatus.value = "open";
    }
    render();
  } catch (err) {
    tableEl.innerHTML = `<p class="empty">${esc(err.message)}</p>`;
  }
}

function visibleRows() {
  const filter = fStatus.value;
  const min = fScore.value === "" ? null : Number(fScore.value);
  const q = fSearch.value.trim().toLowerCase();
  return applySort(state.rows.filter((r) => {
    if (filter === "open" && r.terminal) return false;
    if (filter !== "open" && filter !== "all" && r.status !== filter) return false;
    if (min !== null && (r.score ?? 0) < min) return false;
    if (q && !(`${r.company ?? ""} ${r.title ?? ""}`.toLowerCase().includes(q))) return false;
    return true;
  }));
}

function statusSelect(row) {
  const opts = state.statuses
    .map((s) => `<option value="${esc(s.id)}"${s.id === row.status ? " selected" : ""}>${esc(s.label)}</option>`)
    .join("");
  return `<select data-id="${row.id}">${opts}</select>`;
}

function render() {
  // The filter inputs are wired before the first load resolves, so a keystroke
  // during it would reach here with nothing to render.
  if (!state) return;
  const rows = visibleRows();
  metaEl.textContent = `${rows.length} of ${state.total} posting${state.total === 1 ? "" : "s"}`
    + (state.salary_meta ? `  ·  ≈ market benchmark, ${state.salary_meta.unit}` : "");
  if (!rows.length) {
    tableEl.innerHTML = `<p class="empty">Nothing matches.</p>`;
    syncStickyOffset();
    return;
  }
  const body = rows.map((r) => {
    const href = safeHref(r.url);
    const title = href
      ? `<a href="${esc(href)}" target="_blank" rel="noreferrer">${esc(r.title || r.url)}</a>`
      : esc(r.title || r.url || "—");
    const verdict = r.verdict ? `<span class="badge ${esc(r.verdict)}">${esc(r.verdict)}</span>` : "";
    const expired = r.is_expired && !r.terminal ? ` <span class="badge warn">past deadline</span>` : "";
    const app = r.application_slug ? `&rarr; ${esc(r.application_slug)}` : "";
    return `<tr class="${r.terminal ? "terminal" : ""}" data-id="${r.id}">
      <td class="co">${esc(r.company || "—")}</td>
      <td class="title">${title}${expired}</td>
      ${salaryCell(r.salary)}
      <td class="status">${statusSelect(r)}</td>
      <td class="num">${r.score ?? ""}</td>
      <td>${verdict}</td>
      <td class="num">${esc(fmtDate(r.deadline))}</td>
      <td>${esc(r.source || "")}</td>
      <td class="num">${esc(fmtDate(r.first_seen))}</td>
      <td class="note" data-id="${r.id}" title="click to edit">${esc(r.note || "")}</td>
      <td class="app">${app}</td>
    </tr>`;
  }).join("");
  const head = [
    ["company", "Company"], ["title", "Title"],
    // Says what it orders by, because that is not what the column shows. A
    // figure a posting states is its own sentence, in its own currency and
    // period, and no regex turns that into a number without picking one of
    // them for you -- so the benchmark orders every row, and a company the
    // dataset does not cover has nothing to be ordered on and sinks.
    ["salary", "Salary", "Sort by the market benchmark for the company — "
      + "the one figure every row can be compared on. A salary a posting "
      + "states is left in its own words, and is not parsed into a number."],
    ["status", "Status", "Sort by Status, in funnel order"],
    ["score", "Score"],
    ["verdict", "Verdict", "Sort by Verdict, strong to poor"],
    ["deadline", "Deadline"], ["source", "Source"], ["first_seen", "First seen"],
    ["note", "Note"],
  ].map(([key, label, hint]) => {
    const on = sort.key === key;
    const aria = on ? ` aria-sort="${sort.dir === 1 ? "ascending" : "descending"}"` : "";
    const arrow = on ? `<span class="arrow">${sort.dir === 1 ? "▲" : "▼"}</span>` : "";
    return `<th data-key="${key}"${aria} title="${esc(hint || `Sort by ${label}`)}">${label}${arrow}</th>`;
  }).join("");

  tableEl.innerHTML = `<table>
    <thead><tr>${head}<th></th></tr></thead>
    <tbody>${body}</tbody></table>`;

  tableEl.querySelectorAll("th[data-key]").forEach((th) => {
    th.addEventListener("click", () => toggleSort(th.dataset.key));
  });
  tableEl.querySelectorAll("td.status select").forEach((sel) => {
    sel.addEventListener("change", () => setStatus(Number(sel.dataset.id), sel.value));
  });
  tableEl.querySelectorAll("td.note").forEach((td) => {
    td.addEventListener("click", () => editNote(td, Number(td.dataset.id)));
  });

  // After the header has its text, not before. #meta is inside <header>, it is
  // filled above, and the salary legend is long enough to wrap the header onto
  // a second line at narrow widths -- measuring the empty one leaves the
  // column headers parked too high, under an opaque header, covering the first
  // rows. That is the bug the measurement exists to prevent.
  syncStickyOffset();
}

function rowById(id) {
  return state.rows.find((r) => r.id === id) || null;
}

async function setStatus(id, status) {
  const row = rowById(id);
  if (!row || row.status === status) return;
  try {
    const res = await api("/api/posting/status", { id, status, updated_at: row.updated_at });
    setState(res.table);
    render();
    toast(`${row.company || "Posting"}: ${res.posting.status_label}`, true);
  } catch (err) {
    toast(err.message);
    load();  // the server refused; show the truth rather than our stale copy
  }
}

function editNote(td, id) {
  if (td.classList.contains("editing")) return;
  const row = rowById(id);
  if (!row) return;
  td.classList.add("editing");
  td.innerHTML = `<textarea>${esc(row.note || "")}</textarea>`;
  const area = td.querySelector("textarea");
  area.focus();
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const text = area.value.trim();
    if (!save || text === (row.note || "")) { render(); return; }
    try {
      const res = await api("/api/posting/note", { id, text });
      setState(res.table);
      render();
      toast("Note saved", true);
    } catch (err) { toast(err.message); load(); }
  };
  area.addEventListener("blur", () => finish(true));
  area.addEventListener("keydown", (e) => {
    if (e.key === "Escape") finish(false);
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) finish(true);
  });
}

fStatus.addEventListener("change", () => { rememberFilter(fStatus.value); render(); });
fScore.addEventListener("input", render);
fSearch.addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", load);
sort = rememberedSort();
syncStickyOffset();
window.addEventListener("resize", syncStickyOffset);
// The agent may change the table while this tab sits in the background.
window.addEventListener("focus", load);
load();
</script>
</body>
</html>
