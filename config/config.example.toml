# CareerForge configuration.
#
# Copy to config/config.toml (gitignored) or let /setup generate it.
# Everything here is yours to change; nothing in the framework hardcodes it.

# Language used for status labels and board headings ("en", "ru", or any key
# you add to the [statuses.labels] tables below).
locale = "en"

# Language you want cover letters written in. "posting" matches the language
# of each job posting, which is usually what you want.
cover_letter_language = "posting"


[documents]
# {slug} is replaced with your name slug, e.g. cv_jane_doe.md
cv_filename    = "cv_{slug}.md"
cover_filename = "cover_letter_{slug}.md"
name_slug      = "candidate"

cv_max_pages    = 2
cover_max_pages = 1

# docx -> pdf converter: "auto" prefers MS Word, falls back to LibreOffice.
# Force one with "word" or "libreoffice".
engine = "auto"


[tracker]
# Days of silence after which /triage proposes freezing an application.
stale_after_days = 30


[mail]
# Optional. Reads the mailbox you actually apply from -- which is often not the
# one wired to a chat connector -- and matches employer replies to open
# applications. Any IMAP provider; nothing is ever marked read, moved or
# deleted.
#
# The password goes in .env as MAIL_PASSWORD (or a .mail_password file), never here.
# Use an app password: Gmail requires one, and it can be revoked on its own.
#   Gmail  imap.gmail.com   993   myaccount.google.com/apppasswords
#   Outlook outlook.office365.com 993
#   Fastmail imap.fastmail.com 993
#
# Check with: python tools/mailsync.py check
# host = "imap.gmail.com"
# port = 993
# user = "applications@example.com"
# mailbox = "INBOX"
# ssl = true


[gemini]
# Optional. Delegates bulk gathering and compression to the Gemini CLI so it
# does not spend Claude's context. Judgement about what is honest to claim
# never moves -- that stays with Claude, against profile/ and CLAUDE.md.
#
# Needs `npm install -g @google/gemini-cli` and one authentication: run
# `gemini` once and sign in, or put GEMINI_API_KEY in .env.
# Check with: python tools/gemini.py check
enabled = false
model = "gemini-2.5-flash"
timeout_seconds = 120

# How long a cached company research result stays fresh.
cache_days = 30

# Which jobs to delegate. Drop one from the list to take it back without
# losing the others -- if ranking quality disappoints, remove "rank" and keep
# the research cache.
#   research   company facts and news, with sources
#   extract    job posting text or HTML into structured fields
#   rank       batch-scoring scraped postings
#   summarize  long pages (handbooks, review sites)
tasks = ["research", "extract", "rank", "summarize"]

# Record every prompt sent to Google under tracker/gemini-log/, so what left
# this machine stays inspectable.
log = true


[notion]
# Optional mirror. Everything works without it.
# Run:  python tools/notion_sync.py provision
# to create the databases and write config/notion.json.
enabled = false


[salary]
# Company-name normalisation for salary_lookup.py. Extend for your market.
strip_legal_forms = [
  "a/s", "aps", "i/s", "p/s", "k/s", "ivs", "amba",
  "gmbh", "mbh", "ag", "kg", "ug",
  "ltd", "limited", "plc", "llp", "inc", "incorporated", "corp", "corporation",
  "llc", "co", "company",
  "bv", "nv", "sa", "sas", "sarl", "srl", "spa", "ab", "as", "oy", "sp z oo",
  "lda", "unipessoal", "sl", "sll", "pte", "pty",
]
# Geographic suffixes that are noise in company names, e.g. "Acme Nordic".
strip_regions = [
  "europe", "emea", "nordic", "nordics", "scandinavia", "international", "global",
]


# ---------------------------------------------------------------------------
# Application statuses. Order here is the funnel order and the board's column
# order. `stage` decides which folder an application's documents live in.
# Valid stages: applications | processing | rejected
# ---------------------------------------------------------------------------

[[statuses]]
id = "draft"
stage = "applications"
labels = { en = "Draft", ru = "📝 Подготовка" }

[[statuses]]
id = "applied"
stage = "applications"
labels = { en = "Applied", ru = "📤 Откликнулся" }

[[statuses]]
id = "waiting"
stage = "applications"
labels = { en = "Waiting", ru = "⏳ Жду ответа" }

[[statuses]]
id = "screening"
stage = "processing"
labels = { en = "Screening", ru = "📞 Скрининг" }

[[statuses]]
id = "assignment"
stage = "processing"
labels = { en = "Take-home", ru = "🧪 Тестовое" }

[[statuses]]
id = "interview"
stage = "processing"
labels = { en = "Interview", ru = "💻 Интервью" }

[[statuses]]
id = "final"
stage = "processing"
labels = { en = "Final round", ru = "🏁 Финал" }

[[statuses]]
id = "offer"
stage = "processing"
labels = { en = "Offer", ru = "🎉 Оффер" }

[[statuses]]
id = "rejected"
stage = "rejected"
terminal = true
labels = { en = "Rejected", ru = "❌ Отказ" }

[[statuses]]
id = "frozen"
stage = "rejected"
terminal = true
labels = { en = "Frozen", ru = "🧊 Заморозка" }

[[statuses]]
id = "withdrawn"
stage = "rejected"
terminal = true
labels = { en = "Withdrawn", ru = "🚫 Отозвал" }


